# SAST scanning with Semgrep, based on:
# https://github.com/j3ssie/sample-semgrep-ci
#
# Rolled out org-wide per ATP-3730 (Secureframe SA-1-6: no pre-merge SAST
# gate exists in any of the six ISO27001/SOC2-in-scope repos). Same
# workflow as tf_asp_infra's (aiba-as/tf_asp_infra#692, since fixed by
# aiba-as/tf_asp_infra#700: the baseline diffing below didn't actually
# work there until that fix, see the note on the "Trust the checked-out
# workspace" step).
#
# Baseline diffing (below) scopes each run to only what's new since a
# given commit, so existing findings are not re-flagged, only NEW
# findings introduced by a PR's diff or a push are reported.
#
# --error: the scan fails the job on any finding *new* since the
# baseline (the existing backlog doesn't count, see above). This is the
# gate itself, matching tf_asp_infra (aiba-as/tf_asp_infra, commit
# c6a67da6). It still needs `semgrep/ci` registered as a required status
# check in branch protection to actually block a merge, that part isn't
# done yet (see ATP-3739).
name: Semgrep

on:
  # Scan changed files in PRs (diff-aware scanning):
  pull_request: {}
  # Scan on-demand through the GitHub Actions interface:
  workflow_dispatch: {}
  # Scan main and report all findings:
  push:
    branches: ["main"]

jobs:
  semgrep_scan:
    name: semgrep/ci
    runs-on: ubuntu-latest
    container:
      # Official Semgrep image (returntocorp/semgrep was renamed to this).
      # Pinned to a specific version so a Semgrep release can't silently
      # change CLI behavior, rule formats, or SARIF output out from under
      # this pipeline. Bump deliberately, not automatically.
      image: semgrep/semgrep:1.174.0
    # Skip PRs opened by dependabot to avoid permission issues.
    if: (github.actor != 'dependabot[bot]')
    permissions:
      contents: read

    steps:
      # Full history needed so the baseline commit (PR base, or the
      # previous commit on a push) is actually available locally for
      # --baseline-commit to diff against below.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout runs on the runner host (its own temporary HOME),
      # not inside the `container:` above, so the safe.directory entry it
      # sets there is invisible to the container's HOME (/github/home).
      # Without this, `git cat-file -e` in the next step fails with
      # "detected dubious ownership" (silenced by its 2>/dev/null), which
      # would make every push/PR silently fall back to a full-repo scan
      # instead of a diff against the baseline commit (see
      # aiba-as/tf_asp_infra#700 for how this was found).
      - name: Trust the checked-out workspace inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # NOTE: --config auto picks Semgrep Registry rulesets based on the
      # languages/files it finds (secrets detection, language-specific
      # rules, etc). --error makes the scan step (and job) fail if it
      # reports any finding, see the note at the top of this file. It also
      # applies to the full-scan fallback: on a workflow_dispatch that's
      # just a red run in the Actions UI (it's not a required check, so
      # nothing is blocked), and on push/PR it means a baseline-lookup
      # regression fails loudly instead of silently going back to
      # report-only.
      #
      # --baseline-commit scopes the scan to only what's new since a
      # given commit. workflow_dispatch has no PR/push event to diff
      # against, so it always does a full scan (useful for a periodic
      # full audit).
      - name: Perform Semgrep Analysis
        run: |
          BASELINE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASELINE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASELINE="${{ github.event.before }}"
          fi

          if [ -n "$BASELINE" ] && git cat-file -e "$BASELINE" 2>/dev/null; then
            echo "Baseline commit: $BASELINE (only findings new since then are reported)"
            semgrep scan -q --error --sarif --config auto --baseline-commit "$BASELINE" . > semgrep-results.sarif
          else
            echo "No usable baseline commit (workflow_dispatch, or first push on a new branch) — scanning the full repo"
            semgrep scan -q --error --sarif --config auto . > semgrep-results.sarif
          fi

      # Surfaces findings right on the Actions run page (no GitHub Code
      # Security license needed for this, unlike the Security-tab upload
      # below). Doesn't gate anything, just makes results visible without
      # having to download the SARIF artifact.
      - name: Write scan summary
        if: always() && hashFiles('semgrep-results.sarif') != ''
        run: |
          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys

          # semgrep exits non-zero (env/tool failure, not just --error on
          # findings) leaves this file empty via the step's `>` redirect,
          # and hashFiles() above only guards a missing file, not an empty
          # one, so an empty/corrupt SARIF here is a real possibility, not
          # just defensive paranoia.
          try:
              with open("semgrep-results.sarif") as f:
                  sarif = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError) as e:
              print(f"## Semgrep scan results\n\nError reading SARIF file: {e}\n")
              sys.exit(0)

          results = sarif.get("runs", [{}])[0].get("results", [])
          counts = {}
          rows = []
          for r in results:
              level = r.get("level", "warning")
              counts[level] = counts.get(level, 0) + 1
              rule = r.get("ruleId", "?")
              msg = r.get("message", {}).get("text", "").splitlines()[0][:120]
              loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
              path = loc.get("artifactLocation", {}).get("uri", "?")
              line = loc.get("region", {}).get("startLine", "?")
              rows.append((path, line, level, rule, msg))

          print("## Semgrep scan results\n")
          if not results:
              print("No findings.\n")
          else:
              breakdown = ", ".join(f"{v} {k}" for k, v in sorted(counts.items()))
              print(f"**{len(results)} finding(s)**: {breakdown}\n")
              print("| File | Line | Severity | Rule | Message |")
              print("|---|---|---|---|---|")
              for path, line, level, rule, msg in rows[:50]:
                  print(f"| `{path}` | {line} | {level} | `{rule}` | {msg} |")
              if len(rows) > 50:
                  print(f"\n_...and {len(rows) - 50} more. Full results in the `semgrep-scan-results` artifact._")
          PY

      # NOTE: intentionally NOT uploading to the GitHub Security Dashboard
      # via github/codeql-action/upload-sarif. That API requires GitHub
      # Advanced Security, which this org does not have on private repos
      # (confirmed while investigating ATP-3730 / SA-1-6) — it would fail
      # on every run for licensing reasons, unrelated to actual findings.
      # Results are still available below as a downloadable artifact.
      - name: Save SARIF results as artifact
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-scan-results
          path: semgrep-results.sarif
